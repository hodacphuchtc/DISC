# Chặn biến bí mật server lọt vào bundle trình duyệt.
# Next.js nhúng GIÁ TRỊ của process.env.* được tham chiếu trong file "use client" thẳng
# vào JS gửi xuống browser. Với DISC, SUPABASE_SERVICE_ROLE_KEY bỏ qua RLS: lộ nó là lộ
# TOÀN BỘ dữ liệu bài làm và thông tin học sinh — dữ liệu cá nhân của TRẺ EM, loại nhạy
# cảm nhất dự án này chạm tới (Nghị định 13/2023).
#
# ⚠️ Danh sách `exclude` của rule thứ hai là DANH SÁCH CỬA CÓ CHỦ ĐÍCH, không phải đo
# đạc — dự án vừa khởi tạo, chưa có file nào. Khi code thật: giữ ĐÚNG MỘT cửa chạm
# service_role (client admin của core), mọi nơi khác đi qua cửa đó. Thêm cửa mới phải
# sửa file này có chủ đích, kèm lý do.

rules:
  - id: cam-bien-bi-mat-trong-use-client
    languages: [typescript]
    severity: ERROR
    message: >
      Biến bí mật server trong file "use client" — Next sẽ nhúng GIÁ TRỊ vào bundle gửi
      xuống trình duyệt. Chuyển logic vào server action / route handler.
    paths:
      include: ["**/modules/**", "**/app/**"]
    patterns:
      - pattern: process.env.$KEY
      - metavariable-regex:
          metavariable: $KEY
          regex: "^(SUPABASE_SERVICE_ROLE.*|DATABASE_URL|R2_SECRET_ACCESS_KEY|R2_ACCESS_KEY_ID|CRON_SECRET|.*_SECRET|.*_API_KEY)$"
      - pattern-inside: |
          "use client";
          ...

  - id: service-role-chi-o-mot-cua-cua-core
    languages: [typescript]
    severity: ERROR
    message: >
      SUPABASE_SERVICE_ROLE_KEY chỉ được chạm ở cửa admin của core — nơi khác phải đi
      qua client admin đó. Key này bỏ qua RLS, đụng thẳng dữ liệu học sinh.
    paths:
      include: ["**/modules/**", "**/app/**"]
      exclude:
        - "**/modules/core/auth/supabase-admin.ts"
    pattern: process.env.SUPABASE_SERVICE_ROLE_KEY
